name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-backend:
    name: Build & Test .NET Microservices
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x' # Dùng bản .NET 10 như máy bạn
    - name: Build Solution
      run: dotnet build PollSystem.sln -c Release

  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    - name: Install & Build
      working-directory: ./frontend
      run: |
        npm install
        npm run build